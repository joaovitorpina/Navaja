[package]
name = "navaja"
description = "Navaja: an offline, cross-platform developer toolbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "navaja"

[lib]
# Distinct from the binary name to avoid a PDB filename collision on MSVC.
name = "navaja_lib"

[[bin]]
name = "navaja"
path = "src/main.rs"

[features]
# Derive TypeScript bindings for the app's own IPC types (cargo xtask bindings).
ts = ["dep:ts-rs", "navaja-core/ts"]
# End-to-end tests only: WebdriverIO's Tauri plugins, including an embedded
# WebDriver server on localhost that starts only when the test harness
# launches the app. Never part of a release build: `cargo xtask check` asserts
# that no default feature reaches `e2e` and that only `e2e` enables the plugins.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
arboard = { version = "3.6.1", default-features = false }
dirs = "7.0.0"
navaja-core = { workspace = true }
navaja-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# macos-proxy: the dead proxy on macOS too (window.rs, DEAD_PROXY). It needs
# macOS 14, the minimum set in tauri.conf.json and .cargo/config.toml.
tauri = { workspace = true, features = ["tray-icon", "image-png", "macos-proxy"] }
# Called from Rust only, through its free functions (src/opener.rs). Never
# registered, so the webview has none of its commands.
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-wdio = { version = "1.4.0", optional = true }
# Pinned to upstream PR webdriverio/desktop-mobile#687, which fixes the
# webview2-com 0.38/0.39 clash with Tauri 2.12 on Windows (issue #684).
# Back to crates.io once a release includes it. Test-only (feature `e2e`).
tauri-plugin-wdio-webdriver = { git = "https://github.com/webdriverio/desktop-mobile", rev = "8c27b0e8c0493a60a8fdcc28aab4260dbee0ed9b", optional = true }
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
ts-rs = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Turns WebRTC off in WebKit (platform/macos.rs); the version Tauri already uses.
objc2 = "0.6.4"

[target.'cfg(target_os = "linux")'.dependencies]
# Clipboard on Wayland through the data-control protocol (X11 works without it).
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
# Checks for the tray's appindicator library, which tray-icon panics without.
libloading = "0.7.4"

# tests/clipboard reads the clipboard back through each OS's own API rather
# than arboard, so an arboard change cannot hide a missing marker. Crates the
# app already builds with; only features are added.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = "0.13.2"
# The probe arboard runs to choose Wayland or X11, so the test makes the same
# choice.
wl-clipboard-rs = "0.9.4"

[lints]
workspace = true
