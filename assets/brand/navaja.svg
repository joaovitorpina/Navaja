<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- PLACEHOLDER app mark (M2a). The final mark is drawn in M2b following GUIDELINES.md:
       a folding knife with its tools fanned out from one pivot. No cross, no shield. -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#1F2328"/>
  <g transform="translate(330 700)">
    <!-- pick -->
    <path transform="rotate(-92)" d="M0 -14 L360 -14 L470 0 L360 14 L0 14 Z" fill="#9DA5AE"/>
    <!-- screwdriver -->
    <path transform="rotate(-64)" d="M0 -22 L380 -22 L432 -10 L432 10 L380 22 L0 22 Z" fill="#D0D7DE"/>
    <!-- blade -->
    <path transform="rotate(-36)" d="M0 -38 L430 -38 Q525 -30 575 8 L0 38 Z" fill="#F6F8FA"/>
    <!-- handle -->
    <rect transform="rotate(8)" x="-70" y="-62" width="600" height="124" rx="62" fill="#57606A"/>
    <!-- pivot rivet -->
    <circle r="36" fill="#D69E2E" stroke="#975A16" stroke-width="10"/>
  </g>
</svg>
