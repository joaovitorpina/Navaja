[package]
name = "xtask"
description = "Repository tasks: cargo xtask check | acl | bindings | tool-gate | licenses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
serde = { workspace = true }
serde_json = { workspace = true }
# The app's version; reads deny.toml and js-licenses.toml.
toml = "1.1.6"
# Resolves the app's ACL with tauri-codegen's own code (src/acl.rs). Pinned to
# the exact version `tauri` resolves to, so the snapshot follows the rules the
# app is built with; Renovate moves it with the tauri group. The resolver
# needs none of its features.
tauri-utils = { version = "=2.10.1", default-features = false }

[lints]
workspace = true
