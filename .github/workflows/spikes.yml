name: spikes

# Spike steps that need no human (docs/roadmap.md §2; results go in
# docs/spikes.md). Run by hand from the Actions tab, and on a PR that changes
# this workflow or scripts/spikes/.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/spikes.yml
      - scripts/spikes/**

permissions:
  contents: read

concurrency:
  group: spikes-${{ github.ref }}
  # Cancel superseded PR runs only; a run started by hand keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The same as ci.yml, so that rust-cache computes the same cache key.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  # S2.2: can a custom view live in tools/<id>/ui/, outside app/? A throwaway
  # tool with a custom view (scripts/spikes/s2-2-probe.sh) goes through every
  # check the roadmap's PASS names, each in its own step. svelte-check, ESLint
  # and Prettier each also get a negative control, files in the view folder
  # they must refuse, and HMR is checked at the dev server and in the app's
  # own webview. A failed check doesn't stop the ones after it, and the last
  # step writes a PASS/FAIL table to the run's summary.
  s2-2:
    name: S2.2 views outside app/ (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pinned runner labels (never -latest), as in ci.yml.
        os: [windows-2025, ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    # As ci.yml's os job: a hung end-to-end run fails here instead of holding
    # the runner for 6 h.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux system packages for Tauri and the end-to-end run
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev xvfb dbus

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      # Restores what ci.yml's os job saved on main, under the same key. The
      # spike never saves: its target directory holds the probe.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # macOS: a cache from before the macOS 14 deployment target holds
          # dependencies that cargo keeps reusing as they are, since it
          # rebuilds a crate for a new MACOSX_DEPLOYMENT_TARGET only if the
          # crate reads it (run 37160662985: 359 cached proc macros and build
          # scripts still targeted 11.0). A key of its own rebuilds them once.
          # rust-cache ignores its `key` input next to a shared key.
          shared-key: ${{ matrix.os }}${{ runner.os == 'macOS' && '-macos14' || '' }}
          save-if: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: a. Create the probe tool in tools/probe/
        id: probe
        run: bash scripts/spikes/s2-2-probe.sh create

      - name: b. Registry accepts the probe (cargo test -p navaja-tools)
        id: registry
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        run: bash scripts/spikes/s2-2-check.sh registry

      - name: c. svelte-check passes the view (pnpm check)
        id: check
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        run: pnpm check

      # The negative controls: each adds files to the probe that must fail
      # the check above it, and removes them again.
      - name: c. svelte-check refuses type errors in the view (.ts and .svelte)
        id: check_refuses
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        run: bash scripts/spikes/s2-2-check.sh typecheck-refuses

      - name: d. ESLint and Prettier pass the view (pnpm lint)
        id: lint
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        run: pnpm lint

      - name: d. ESLint refuses forbidden imports in the view (.ts and .svelte)
        id: lint_refuses
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        run: bash scripts/spikes/s2-2-check.sh lint-refuses

      - name: d. Prettier refuses a misformatted file in the view
        id: prettier_refuses
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        run: bash scripts/spikes/s2-2-check.sh prettier-refuses

      - name: e. Vitest runs the view's test (pnpm test)
        id: vitest
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        run: bash scripts/spikes/s2-2-check.sh vitest

      - name: f. The build gives the view its own chunk and its CSS (pnpm build)
        id: build
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        run: bash scripts/spikes/s2-2-check.sh build

      - name: g. Build the app for the end-to-end run
        id: packaged_build
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        run: pnpm tauri build --debug --no-bundle --features e2e --config src-tauri/e2e.conf.json

      # The probe's spec only, not the suite. On Linux inside dbus-run-session
      # and xvfb-run, as in ci.yml, but without the strace network guard,
      # which runs the whole suite and is ci.yml's job.
      - name: g. The packaged app shows the view and its answer from Rust
        id: packaged
        if: ${{ !cancelled() && steps.packaged_build.outcome == 'success' }}
        run: bash scripts/spikes/s2-2-check.sh packaged

      - name: h. Vite hot-reloads the view and its import (HMR, dev server)
        id: hmr
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        run: node scripts/spikes/hmr-check.mjs

      # The same app and e2e overlay as g, but built by cargo without Tauri's
      # custom-protocol feature (`tauri build` always adds it): tauri::is_dev()
      # is true, so the app loads build.devUrl, the Vite dev server on 1420.
      # It replaces g's binary in target/debug, so it comes after g.
      - name: h2. Build the app in dev mode (no custom-protocol)
        id: hmr_app_build
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        run: TAURI_CONFIG="$(cat app/src-tauri/e2e.conf.json)" cargo build -p navaja --features e2e

      - name: h2. HMR in the app's webview
        id: hmr_app
        if: ${{ !cancelled() && steps.hmr_app_build.outcome == 'success' }}
        run: bash scripts/spikes/s2-2-check.sh hmr-app

      # Also proves that `remove` puts tools/lib.rs back on every OS.
      - name: Remove the probe; the tree is clean again
        id: remove
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        run: |
          bash scripts/spikes/s2-2-probe.sh remove
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "::error::files left after removing the probe:"
            printf '%s\n' "$changes"
            exit 1
          fi

      - name: i. Summary
        if: always()
        env:
          OS: ${{ matrix.os }}
          PROBE: ${{ steps.probe.outcome }}
          REGISTRY: ${{ steps.registry.outcome }}
          CHECK: ${{ steps.check.outcome }}
          CHECK_REFUSES: ${{ steps.check_refuses.outcome }}
          LINT: ${{ steps.lint.outcome }}
          LINT_REFUSES: ${{ steps.lint_refuses.outcome }}
          PRETTIER_REFUSES: ${{ steps.prettier_refuses.outcome }}
          VITEST: ${{ steps.vitest.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PACKAGED_BUILD: ${{ steps.packaged_build.outcome }}
          PACKAGED: ${{ steps.packaged.outcome }}
          HMR: ${{ steps.hmr.outcome }}
          HMR_APP_BUILD: ${{ steps.hmr_app_build.outcome }}
          HMR_APP: ${{ steps.hmr_app.outcome }}
          REMOVE: ${{ steps.remove.outcome }}
        run: |
          result() {
            case "$1" in
              success) echo PASS ;;
              failure) echo FAIL ;;
              skipped | '') echo 'not run' ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "### S2.2 views outside app/: $OS"
            echo
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| a. Probe created (\`s2-2-probe.sh create\`) | $(result "$PROBE") |"
            echo "| b. Registry accepts it (\`cargo test -p navaja-tools\`) | $(result "$REGISTRY") |"
            echo "| c. svelte-check passes the view (\`pnpm check\`) | $(result "$CHECK") |"
            echo "| c. svelte-check refuses type errors (.ts and .svelte) | $(result "$CHECK_REFUSES") |"
            echo "| d. ESLint and Prettier pass the view (\`pnpm lint\`) | $(result "$LINT") |"
            echo "| d. ESLint refuses forbidden imports (.ts and .svelte) | $(result "$LINT_REFUSES") |"
            echo "| d. Prettier refuses a misformatted file | $(result "$PRETTIER_REFUSES") |"
            echo "| e. Vitest runs the view's test (\`pnpm test\`) | $(result "$VITEST") |"
            echo "| f. Build: own chunk, Tailwind class in the CSS (\`pnpm build\`) | $(result "$BUILD") |"
            echo "| g. Packaged app builds (\`tauri build --features e2e\`) | $(result "$PACKAGED_BUILD") |"
            echo "| g. Packaged app shows the view and the answer from Rust | $(result "$PACKAGED") |"
            echo "| h. HMR for the view and its import, at the dev server | $(result "$HMR") |"
            echo "| h2. Dev build (\`cargo build --features e2e\`, no custom-protocol) | $(result "$HMR_APP_BUILD") |"
            echo "| h2. HMR in the app's webview | $(result "$HMR_APP") |"
            echo "| Probe removed, tree clean | $(result "$REMOVE") |"
          } >> "$GITHUB_STEP_SUMMARY"

  # S2.3: is the tray icon crisp, and does the macOS template icon work? It
  # runs the app as shipped (`tauri build --debug --no-bundle`, no e2e
  # overlay).
  # - macOS (scripts/spikes/s2-3-check.sh): the menu bar captured before the
  #   app starts and with it running, in the light and the dark appearance,
  #   then checks on the icon's pixels against a system item's. Two negative
  #   controls: the presence check on the capture taken before the app
  #   started, and the tint check on a build whose icon is not a template.
  # - Windows (scripts/spikes/s2-3-tray.ps1): the icon promoted out of the
  #   overflow, found through UI Automation and captured at the runner's own
  #   scale, then a check that its button has an icon drawn in it. Its
  #   negative control is the same check on an empty stretch of the taskbar.
  #   Other scales need a person (docs/spikes.md).
  # The captures are the run's artifact.
  s2-3:
    name: S2.3 tray icon (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      # Restores what ci.yml's os job saved on main, under the same key.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # macOS: a cache from before the macOS 14 deployment target holds
          # dependencies that cargo keeps reusing as they are, since it
          # rebuilds a crate for a new MACOSX_DEPLOYMENT_TARGET only if the
          # crate reads it (run 37160662985: 359 cached proc macros and build
          # scripts still targeted 11.0). A key of its own rebuilds them once.
          # rust-cache ignores its `key` input next to a shared key.
          shared-key: ${{ matrix.os }}${{ runner.os == 'macOS' && '-macos14' || '' }}
          save-if: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: a. Build the app as shipped (no e2e overlay)
        id: build
        run: pnpm tauri build --debug --no-bundle

      - name: b. Menu bar helper, and the display's size and scale (macOS)
        id: helper
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: bash scripts/spikes/s2-3-check.sh helper

      - name: c. Capture the menu bar before the app starts (macOS)
        id: baseline
        if: ${{ !cancelled() && steps.helper.outcome == 'success' }}
        run: bash scripts/spikes/s2-3-check.sh baseline

      - name: d. The app starts and its status item appears (macOS)
        id: launch
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.baseline.outcome == 'success' }}
        run: bash scripts/spikes/s2-3-check.sh launch

      - name: e. Capture the menu bar in the light and the dark appearance (macOS)
        id: capture
        if: ${{ !cancelled() && steps.launch.outcome == 'success' }}
        run: bash scripts/spikes/s2-3-check.sh capture

      - name: f. The icon is drawn in both captures (macOS)
        id: present
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: bash scripts/spikes/s2-3-check.sh present

      - name: f. The same check finds no icon before the app starts (macOS)
        id: present_refuses
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: bash scripts/spikes/s2-3-check.sh present-refuses

      - name: g. Monochrome, and tinted like a system item in each appearance (macOS)
        id: tint
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: bash scripts/spikes/s2-3-check.sh tint

      # Overwrites target/debug/navaja, so it runs after the checks above.
      - name: h. Build the app again with its icon not a template (macOS)
        id: control_build
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        run: bash scripts/spikes/s2-3-check.sh control-build

      - name: h. The tint check fails on that build's icon (macOS)
        id: tint_refuses
        if: ${{ !cancelled() && steps.control_build.outcome == 'success' }}
        run: bash scripts/spikes/s2-3-check.sh tint-refuses

      - name: Quit the app and put the appearance back (macOS)
        if: ${{ always() && runner.os == 'macOS' }}
        run: bash scripts/spikes/s2-3-check.sh stop

      - name: b. No Navaja icon in the notification area before the app starts (Windows)
        id: win_before
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/spikes/s2-3-tray.ps1 before

      - name: c. The app starts; UI Automation finds its notification-area button (Windows)
        id: win_launch
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.win_before.outcome == 'success' }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/spikes/s2-3-tray.ps1 launch

      - name: d. Capture the notification area at the runner's scale (Windows)
        id: win_capture
        if: ${{ !cancelled() && steps.win_launch.outcome == 'success' }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/spikes/s2-3-tray.ps1 capture

      - name: e. An icon is drawn in that button (Windows)
        id: win_present
        if: ${{ !cancelled() && steps.win_capture.outcome == 'success' }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/spikes/s2-3-tray.ps1 present

      - name: e. The same check finds no icon on an empty stretch of the taskbar (Windows)
        id: win_present_refuses
        if: ${{ !cancelled() && steps.win_capture.outcome == 'success' }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/spikes/s2-3-tray.ps1 present-refuses

      - name: Quit the app and put its icon's IsPromoted back (Windows)
        if: ${{ always() && runner.os == 'Windows' }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/spikes/s2-3-tray.ps1 stop

      # tray.rs is put back by control-build itself, or by `stop` if
      # control-build was cut short with its edit in place.
      - name: The tree is clean again
        id: clean
        if: always()
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "::error::files left after the checks:"
            printf '%s\n' "$changes"
            exit 1
          fi

      # The captures, the rectangles the checks measured (*.rect), so that
      # `present` and `present-refuses` can run again on the artifact, and
      # the app's own output (*.log on macOS; navaja.out and .err on Windows).
      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s2-3-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/navaja-s2-3/*.png
            ${{ runner.temp }}/navaja-s2-3/*.txt
            ${{ runner.temp }}/navaja-s2-3/*.log
            ${{ runner.temp }}/navaja-s2-3/*.rect
            ${{ runner.temp }}/navaja-s2-3/*.out
            ${{ runner.temp }}/navaja-s2-3/*.err
          if-no-files-found: warn
          retention-days: 30

      - name: i. Summary
        if: always()
        env:
          OS: ${{ matrix.os }}
          BUILD: ${{ steps.build.outcome }}
          HELPER: ${{ steps.helper.outcome }}
          BASELINE: ${{ steps.baseline.outcome }}
          LAUNCH: ${{ steps.launch.outcome }}
          CAPTURE: ${{ steps.capture.outcome }}
          PRESENT: ${{ steps.present.outcome }}
          PRESENT_REFUSES: ${{ steps.present_refuses.outcome }}
          TINT: ${{ steps.tint.outcome }}
          CONTROL_BUILD: ${{ steps.control_build.outcome }}
          TINT_REFUSES: ${{ steps.tint_refuses.outcome }}
          WIN_BEFORE: ${{ steps.win_before.outcome }}
          WIN_LAUNCH: ${{ steps.win_launch.outcome }}
          WIN_CAPTURE: ${{ steps.win_capture.outcome }}
          WIN_PRESENT: ${{ steps.win_present.outcome }}
          WIN_PRESENT_REFUSES: ${{ steps.win_present_refuses.outcome }}
          CLEAN: ${{ steps.clean.outcome }}
        run: |
          result() {
            case "$1" in
              success) echo PASS ;;
              failure) echo FAIL ;;
              skipped | '') echo 'not run' ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "### S2.3 tray icon: $OS"
            echo
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| a. App builds as shipped (\`tauri build --debug --no-bundle\`) | $(result "$BUILD") |"
            if [ "$RUNNER_OS" = macOS ]; then
              echo "| b. Menu bar helper compiles; display size and scale | $(result "$HELPER") |"
              echo "| c. Menu bar captured before the app starts (light) | $(result "$BASELINE") |"
              echo "| d. App starts; its status item appears | $(result "$LAUNCH") |"
              echo "| e. Menu bar captured in light and dark appearance (read back) | $(result "$CAPTURE") |"
              echo "| f. Icon drawn in both captures | $(result "$PRESENT") |"
              echo "| f. Same check finds no icon before the app starts | $(result "$PRESENT_REFUSES") |"
              echo "| g. Monochrome; tinted like a system item in each appearance | $(result "$TINT") |"
              echo "| h. Control build, icon not a template | $(result "$CONTROL_BUILD") |"
              echo "| h. Tint check fails on that icon | $(result "$TINT_REFUSES") |"
            else
              echo "| b. No Navaja icon in the notification area before the app starts | $(result "$WIN_BEFORE") |"
              echo "| c. App starts; UI Automation finds its notification-area button | $(result "$WIN_LAUNCH") |"
              echo "| d. Notification area captured at the runner's scale | $(result "$WIN_CAPTURE") |"
              echo "| e. An icon is drawn in that button | $(result "$WIN_PRESENT") |"
              echo "| e. Same check finds no icon on an empty stretch of the taskbar | $(result "$WIN_PRESENT_REFUSES") |"
              echo "| Crisp at 100-200 % | needs a person (docs/spikes.md) |"
            fi
            echo "| Tree clean | $(result "$CLEAN") |"
          } >> "$GITHUB_STEP_SUMMARY"

  # M2a exit check "Copy stays out of Windows clipboard history" (roadmap
  # M2a, Exit). The job turns clipboard history on for the runner's user.
  # Navaja's Copy button must put a fresh UUID on the clipboard, with the
  # exclusion formats Windows documents (and an ordinary copy of the same
  # text must fail that check). Where history turns on, an ordinary copy
  # must reach it (the control), Navaja's must not, and the same UUID
  # copied the ordinary way must (the lookup's negative control). Windows
  # Server keeps history off, so on windows-2025 those three steps are
  # skipped, the job stays green with a warning, and the summary says the
  # runner cannot answer. Those three steps have never run with history on.
  # Scripts: scripts/spikes/exit-clipboard-check.sh and clipboard-history.ps1.
  exit-clipboard-history:
    name: Exit check, copy stays out of clipboard history (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-2025
          save-if: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: a. Build the app for the end-to-end run
        id: build
        run: pnpm tauri build --debug --no-bundle --features e2e --config src-tauri/e2e.conf.json

      # Sets the step output `enabled`. It fails only on an error, not when
      # Windows keeps history off; then it leaves a warning on the run, so
      # that the green job does not read as the exit check passing.
      - name: b. Turn on clipboard history for the runner's user
        id: enable
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/spikes/clipboard-history.ps1 enable

      - name: c. Control, an ordinary copy reaches clipboard history
        id: control
        if: ${{ !cancelled() && steps.enable.outputs.enabled == 'true' }}
        run: bash scripts/spikes/exit-clipboard-check.sh control

      - name: d. Navaja's Copy button puts a fresh UUID on the clipboard
        id: copy
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.enable.outcome == 'success' }}
        run: bash scripts/spikes/exit-clipboard-check.sh copy

      - name: e. Navaja's copy carries the exclusion formats
        id: formats
        if: ${{ !cancelled() && steps.copy.outcome == 'success' }}
        run: bash scripts/spikes/exit-clipboard-check.sh formats

      - name: f. Navaja's copy stays out of clipboard history
        id: absent
        if: ${{ !cancelled() && steps.copy.outcome == 'success' && steps.control.outcome == 'success' }}
        run: bash scripts/spikes/exit-clipboard-check.sh absent

      # The last two replace the clipboard's contents.
      - name: g. The same UUID, copied the ordinary way, reaches clipboard history
        id: detects
        if: ${{ !cancelled() && steps.copy.outcome == 'success' && steps.control.outcome == 'success' }}
        run: bash scripts/spikes/exit-clipboard-check.sh detects

      - name: h. The formats check refuses the same UUID copied the ordinary way
        id: formats_refuses
        if: ${{ !cancelled() && steps.copy.outcome == 'success' }}
        run: bash scripts/spikes/exit-clipboard-check.sh formats-refuses

      - name: Remove the spec; the tree is clean again
        id: clean
        if: always()
        run: |
          bash scripts/spikes/exit-clipboard-check.sh clean
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "::error::files left after the check:"
            printf '%s\n' "$changes"
            exit 1
          fi

      - name: i. Summary
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          ENABLE: ${{ steps.enable.outcome }}
          ENABLED: ${{ steps.enable.outputs.enabled }}
          CONTROL: ${{ steps.control.outcome }}
          COPY: ${{ steps.copy.outcome }}
          FORMATS: ${{ steps.formats.outcome }}
          ABSENT: ${{ steps.absent.outcome }}
          DETECTS: ${{ steps.detects.outcome }}
          FORMATS_REFUSES: ${{ steps.formats_refuses.outcome }}
          CLEAN: ${{ steps.clean.outcome }}
        run: |
          result() {
            case "$1" in
              success) echo PASS ;;
              failure) echo FAIL ;;
              skipped | '') echo 'not run' ;;
              *) echo "$1" ;;
            esac
          }
          # The enable step passes when Windows keeps history off, so its
          # outcome alone would read PASS for history that is not on.
          enabled() {
            if [ "$ENABLE" != success ]; then
              result "$ENABLE"
            elif [ "$ENABLED" = true ]; then
              echo PASS
            else
              echo 'off: inconclusive (this Windows keeps clipboard history off)'
            fi
          }
          # The steps that need clipboard history, where Windows keeps it off.
          history() {
            if [ "$ENABLE" = success ] && [ "$ENABLED" != true ]; then
              echo 'inconclusive: this Windows keeps clipboard history off'
            else
              result "$1"
            fi
          }
          {
            echo '### Exit check: copy stays out of Windows clipboard history'
            echo
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| a. End-to-end build | $(result "$BUILD") |"
            echo "| b. Clipboard history turned on (\`enabled=${ENABLED:-?}\`) | $(enabled) |"
            echo "| c. Control: an ordinary copy reaches the history | $(history "$CONTROL") |"
            echo "| d. Navaja's Copy button puts a fresh UUID on the clipboard | $(result "$COPY") |"
            echo "| e. Navaja's copy carries the exclusion formats | $(result "$FORMATS") |"
            echo "| f. Navaja's copy stays out of the history | $(history "$ABSENT") |"
            echo "| g. The same UUID, copied the ordinary way, reaches it | $(history "$DETECTS") |"
            echo "| h. The formats check refuses that ordinary copy | $(result "$FORMATS_REFUSES") |"
            echo "| Spec removed, tree clean | $(result "$CLEAN") |"
          } >> "$GITHUB_STEP_SUMMARY"

  # S2.7: does any process of Navaja's tree send a packet, idle or in use?
  # A capture on the runner, a VM, around two phases: the e2e build idling
  # 5 min with its window shown, then the whole end-to-end suite, egress
  # canary included. Each OS captures its own way
  # (scripts/spikes/s2-7-egress.sh): Linux runs the app in a network
  # namespace with NAT and captures its veth; macOS captures on pktap, which
  # names each packet's process, and counts the daemons WebKit starts for
  # the app (those that start within 15 s after it) as the app's; Windows
  # audits WFP connections, process creation, DNS-client queries and BITS
  # jobs, and counts WAM's services in the 15 s after an app start as the
  # app's. A control request first proves that the capture sees and
  # attributes traffic, and each phase must show the app's own WebDriver
  # traffic on loopback. A 5 min baseline without the app comes first:
  # nothing in it may count as the app's, and each later phase lists, for
  # review, the traffic outside the tree that the baseline lacks (on Windows
  # also what came right after an app start). Traffic of those daemons and
  # services that scripts/spikes/s2-7-disclosed.tsv covers is reported as
  # disclosed and fails nothing (docs/adr/0003-webview-network.md); a
  # connection reaches an entry's host only through the lookups its own
  # process made before it. Nothing opens a URL or the logs folder
  # (architecture §5). The captures go up as an artifact; nothing else
  # leaves the runner.
  s2-7:
    name: S2.7 egress capture (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      MATRIX_OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # tcpdump and strace for the capture and ci.yml's network guard;
      # x11-utils (xwininfo) and ImageMagick (import) to check and grab the
      # window on the virtual display.
      - name: Linux system packages for Tauri, the end-to-end run and the capture
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev xvfb dbus strace tcpdump x11-utils imagemagick

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      # Restores what ci.yml's os job saved on main, under the same key.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # macOS: a cache from before the macOS 14 deployment target holds
          # dependencies that cargo keeps reusing as they are, since it
          # rebuilds a crate for a new MACOSX_DEPLOYMENT_TARGET only if the
          # crate reads it (run 37160662985: 359 cached proc macros and build
          # scripts still targeted 11.0). A key of its own rebuilds them once.
          # rust-cache ignores its `key` input next to a shared key.
          shared-key: ${{ matrix.os }}${{ runner.os == 'macOS' && '-macos14' || '' }}
          save-if: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the app for the end-to-end run
        id: build
        run: pnpm tauri build --debug --no-bundle --features e2e --config src-tauri/e2e.conf.json

      # The dead proxy needs macOS 14 (ci.yml checks every build there).
      - name: The app targets the minimum macOS (tauri.conf.json)
        if: runner.os == 'macOS'
        run: bash scripts/check-macos-target.sh target/debug/navaja

      - name: Set up the capture
        id: setup
        run: bash scripts/spikes/s2-7-egress.sh setup

      - name: Control, a known request is captured and attributed
        id: control
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/spikes/s2-7-egress.sh control

      # Before the app ever runs here, so that the daemons it starts are not
      # running yet.
      - name: Baseline, 5 min under capture without the app
        id: baseline
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/spikes/s2-7-egress.sh baseline

      - name: Baseline, nothing counts as the app's while it is not running
        id: baseline_check
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        run: bash scripts/spikes/s2-7-egress.sh check baseline

      - name: Idle, the app runs 5 min with its window shown, under capture
        id: idle
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/spikes/s2-7-egress.sh idle

      - name: Idle, nothing from the process tree or the services it wakes but the disclosed list
        id: idle_check
        if: ${{ !cancelled() && (steps.idle.outcome == 'success' || steps.idle.outcome == 'failure') }}
        run: bash scripts/spikes/s2-7-egress.sh check idle

      - name: In use, the end-to-end suite passes under capture (pnpm e2e)
        id: in_use
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/spikes/s2-7-egress.sh in-use

      - name: In use, nothing from the process tree or the services it wakes but the disclosed list
        id: in_use_check
        if: ${{ !cancelled() && (steps.in_use.outcome == 'success' || steps.in_use.outcome == 'failure') }}
        run: bash scripts/spikes/s2-7-egress.sh check in-use

      - name: Tear down the capture
        if: ${{ always() && steps.setup.outcome != 'skipped' }}
        run: bash scripts/spikes/s2-7-egress.sh teardown

      # Captures, exported events (Windows), listings, the app's output and
      # a screenshot. What holds other processes' traffic keeps little of
      # it: on Linux the uplink captures keep 96 bytes a packet (DNS: 512);
      # on Windows pktmon's copy keeps headers only, but for DNS, and the
      # process-creation events lose the command lines of processes outside
      # the tree; on macOS pktap keeps 512 bytes a packet, enough for DNS.
      # Anyone who can see the run can download it, so it is kept 14 days.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: s2-7-${{ matrix.os }}
          path: ${{ runner.temp }}/navaja-s2-7
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        env:
          OS: ${{ matrix.os }}
          OUT: ${{ runner.temp }}/navaja-s2-7
          BUILD: ${{ steps.build.outcome }}
          SETUP: ${{ steps.setup.outcome }}
          CONTROL: ${{ steps.control.outcome }}
          BASELINE: ${{ steps.baseline.outcome }}
          BASELINE_CHECK: ${{ steps.baseline_check.outcome }}
          IDLE: ${{ steps.idle.outcome }}
          IDLE_CHECK: ${{ steps.idle_check.outcome }}
          IN_USE: ${{ steps.in_use.outcome }}
          IN_USE_CHECK: ${{ steps.in_use_check.outcome }}
        run: |
          result() {
            case "$1" in
              success) echo PASS ;;
              failure) echo FAIL ;;
              skipped | '') echo 'not run' ;;
              *) echo "$1" ;;
            esac
          }
          # What a phase's check listed outside the tree for review (what the
          # baseline lacks; on Windows also what came right after an app
          # start): never a FAIL.
          review() {
            local file="$OUT/$1-suspects.count" count
            if [ ! -f "$file" ]; then
              echo 'no list'
              return
            fi
            count=$(tr -dc 0-9 < "$file")
            if [ "${count:-0}" -eq 0 ]; then
              echo 'none'
            else
              echo "$count to review"
            fi
          }
          # What a phase's check reported as disclosed: traffic outside the
          # tree that an entry of scripts/spikes/s2-7-disclosed.tsv covers
          # (docs/adr/0003-webview-network.md). Never a FAIL; anything the
          # list does not cover fails the phase's check instead.
          disclosed() {
            local file="$OUT/$1-disclosed.count" count
            if [ ! -f "$file" ]; then
              echo 'no list'
              return
            fi
            count=$(tr -dc 0-9 < "$file")
            if [ "${count:-0}" -eq 0 ]; then
              echo 'none'
            else
              echo "$count disclosed, see the phase's table"
            fi
          }
          {
            echo "### S2.7 egress capture: $OS"
            echo
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| e2e build (\`tauri build --features e2e\`) | $(result "$BUILD") |"
            echo "| Capture set up | $(result "$SETUP") |"
            echo "| Control: a known request is captured and attributed | $(result "$CONTROL") |"
            echo "| Baseline: 5 min under capture without the app | $(result "$BASELINE") |"
            echo "| Baseline: nothing counts as the app's | $(result "$BASELINE_CHECK") |"
            echo "| Idle: the app runs 5 min with its window shown | $(result "$IDLE") |"
            echo "| Idle: nothing from the process tree or the services it wakes but the disclosed list | $(result "$IDLE_CHECK") |"
            echo "| Idle: delegated traffic on the disclosed list | $(disclosed idle) |"
            echo "| Idle: traffic outside the tree, listed for review | $(review idle) |"
            echo "| In use: \`pnpm e2e\` passes, egress canary included | $(result "$IN_USE") |"
            echo "| In use: nothing from the process tree or the services it wakes but the disclosed list | $(result "$IN_USE_CHECK") |"
            echo "| In use: delegated traffic on the disclosed list | $(disclosed in-use) |"
            echo "| In use: traffic outside the tree, listed for review | $(review in-use) |"
            echo
            for phase in control baseline idle in-use; do
              [ ! -f "$OUT/$phase-findings.md" ] || cat "$OUT/$phase-findings.md"
            done
          } >> "$GITHUB_STEP_SUMMARY"
