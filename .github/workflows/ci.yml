name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # tool-gate diffs against the PR base.
          fetch-depth: 0

      - name: Line endings are LF
        run: bash scripts/check-eol.sh

      - name: Frozen identifiers are consistent
        run: bash scripts/check-identifiers.sh

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: rustfmt
        run: cargo fmt --all --check

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny

      - name: cargo-deny (bans, licenses, sources)
        run: cargo deny --all-features check bans licenses sources

      # `xtask check` (the ACL snapshot) and `xtask bindings` build the app crate,
      # which links Tauri.
      - name: Linux system packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: checks
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: xtask check (crate edges, dependency closures, Tauri parity and config, ACL snapshot)
        run: cargo xtask check

      - name: TypeScript bindings are up to date
        run: cargo xtask bindings --check

      - name: Tool PR gate
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cargo xtask tool-gate "origin/$BASE_REF"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: svelte-check and tsc
        run: pnpm check

      - name: ESLint (with the custom-view import allowlist) and Prettier
        run: pnpm lint

  web:
    name: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm test

  os:
    name: os (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pinned runner labels (never -latest), as decided in docs/adr/0001-stack.md.
        os: [windows-2025, ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    # A hung end-to-end run (a second instance that never exits, an app that
    # never answers) fails here instead of holding the runner for 6 h.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Line endings are LF
        shell: bash
        run: bash scripts/check-eol.sh

      - name: Frozen identifiers are consistent
        shell: bash
        run: bash scripts/check-identifiers.sh

      - name: Linux system packages for Tauri and the end-to-end run
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev xvfb dbus strace

      - name: Install Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: nextest
        run: cargo nextest run --workspace

      - name: doctests
        run: cargo test --doc --workspace

      - name: Build the app (front end embedded, no bundle)
        run: pnpm tauri build --debug --no-bundle

      # The same app plus WebdriverIO's test-only plugins (feature `e2e`).
      - name: Build the app for end-to-end tests
        shell: bash
        run: pnpm tauri build --debug --no-bundle --features e2e --config src-tauri/e2e.conf.json

      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: pnpm e2e

      # Virtual display and session bus (single instance uses D-Bus); the app
      # runs under strace and any non-loopback connection fails the job.
      - name: End-to-end tests under the network guard (Linux)
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: dbus-run-session -- xvfb-run -a bash app/e2e/strace-guard.sh
